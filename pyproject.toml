[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter"
version = "0.1.0"
description = "MAD LLM orchestrator over the shared findings DB — the model proposes, the code decides"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.0",
  "rich>=13.0",
  "httpx>=0.27",
]

[project.scripts]
arbiter = "arbiter_app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
